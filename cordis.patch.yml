# dsh-web-search: free web search for the agent, switched in General settings.
# The web row selects the DuckDuckGo provider (Bing is the fallback inside it).
# A row config replaces the shipped one, so fetchProvider is restated here.
- insert:
    - id: dsh-web-search
      name: dsh-web-search
- id: web
  config:
    searchProvider: duckduckgo
    fetchProvider: http
